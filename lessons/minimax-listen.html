<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniMax · George F2 語速試聽</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem 3rem; background: #f6f1e6; color: #222; }
    h1 { font-size: 1.35rem; margin-bottom: .4rem; }
    .hint { color: #555; font-size: .95rem; line-height: 1.5; }
    .group-title { margin: 1.6rem 0 .6rem; font-size: 1.05rem; color: #1f5fc9; }
    section { background: #fff; border-radius: 12px; padding: 1rem 1.1rem; margin: .75rem 0; box-shadow: 0 1px 4px #0001; }
    section.recommended { border: 2px solid #f6ad55; }
    h2 { font-size: 1.02rem; margin: 0 0 .25rem; }
    .meta { color: #666; font-size: .85rem; margin: 0 0 .35rem; }
    .line { margin: 0 0 .7rem; font-size: .98rem; }
    button.play { font-size: 1.02rem; padding: .5rem 1rem; border: 0; border-radius: 10px; background: #2b6cb0; color: #fff; cursor: pointer; }
    button.play.playing { background: #c05621; }
    .err { color: #a00; font-size: .9rem; margin-top: .5rem; }
    .badge { display: inline-block; background: #fff3cd; color: #856404; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>MiniMax · George F2 語速 baseline 試聽</h1>
  <p class="hint">
    鎖定 <strong>cute_boy</strong>、<strong>pitch 0</strong>（F2 定調音色），只改整句 <strong>speed</strong>。<br />
    請用 Chrome / Edge 開啟：
    <code>http://localhost:3456/lessons/minimax-listen.html</code><br />
    聽完告訴我哪個 speed 當 baseline（例如 1.30 或 1.35）。<strong>已定：1.30×</strong>
  </p>
  <div id="list"></div>
  <script>
    const BASE = "assets/lesson-03/voice-tests/";
    const P01 = "Hello! Shall we look for berries near the cave?";
    const P03 = "Is a storm coming, Pip?";
    const clips = [
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd110.mp3", title: "1.10×", meta: "F2 原版定稿 speed", text: P01 },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd120.mp3", title: "1.20×", meta: "略快", text: P01 },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd125.mp3", title: "1.25×", meta: "舊 baseline", text: P01 },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd130.mp3", title: "1.30×", meta: "✓ 目前 lesson baseline", text: P01, recommended: true },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd135.mp3", title: "1.35×", meta: "明顯更快", text: P01 },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd140.mp3", title: "1.40×", meta: "很快", text: P01 },
      { group: "① p01-02 興奮問候（Lesson 3 第一句 George）", file: "f2-p01-spd145.mp3", title: "1.45×", meta: "最快選項", text: P01 },
      { group: "② p03-02 擔心暴風雨（同音色、 fearful）", file: "f2-p03-spd110.mp3", title: "1.10×", meta: "F2 原版 speed · fearful", text: P03 },
      { group: "② p03-02 擔心暴風雨（同音色、 fearful）", file: "f2-p03-spd120.mp3", title: "1.20×", meta: "略快 · fearful", text: P03 },
      { group: "② p03-02 擔心暴風雨（同音色、 fearful）", file: "f2-p03-spd125.mp3", title: "1.25×", meta: "舊 baseline · fearful", text: P03 },
      { group: "② p03-02 擔心暴風雨（同音色、 fearful）", file: "f2-p03-spd130.mp3", title: "1.30×", meta: "✓ 目前 baseline · fearful", text: P03, recommended: true },
      { group: "② p03-02 擔心暴風雨（同音色、 fearful）", file: "f2-p03-spd135.mp3", title: "1.35×", meta: "更快 · fearful", text: P03 }
    ];
    const player = new Audio();
    let currentBtn = null;
    const list = document.getElementById("list");
    let lastGroup = "";
    clips.forEach((clip) => {
      if (clip.group && clip.group !== lastGroup) {
        lastGroup = clip.group;
        const h = document.createElement("h2");
        h.className = "group-title";
        h.textContent = clip.group;
        list.appendChild(h);
      }
      const sec = document.createElement("section");
      if (clip.recommended) sec.classList.add("recommended");
      sec.innerHTML = "<h2></h2><p class='meta'></p><p class='line'></p><button class='play' type='button'>▶ 播放</button><p class='err'></p>";
      const title = sec.querySelector("h2");
      title.textContent = clip.title + (clip.recommended ? " " : "");
      if (clip.recommended) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = "F2 原版";
        title.appendChild(b);
      }
      sec.querySelector(".meta").textContent = clip.meta + " · " + clip.file;
      sec.querySelector(".line").textContent = "「" + clip.text + "」";
      const btn = sec.querySelector(".play");
      const err = sec.querySelector(".err");
      btn.addEventListener("click", () => {
        err.textContent = "";
        if (currentBtn === btn && !player.paused) {
          player.pause();
          btn.textContent = "▶ 播放";
          btn.classList.remove("playing");
          currentBtn = null;
          return;
        }
        document.querySelectorAll("button.play").forEach((b) => {
          b.textContent = "▶ 播放";
          b.classList.remove("playing");
        });
        player.pause();
        player.src = BASE + clip.file + "?v=f2speed";
        player.play().then(() => {
          btn.textContent = "■ 停止";
          btn.classList.add("playing");
          currentBtn = btn;
        }).catch((e) => {
          err.textContent = "無法播放：請確認已執行 python scripts/sample_george_f2_speed.py 並用 npx serve . 開啟（" + e.message + "）";
        });
      });
      player.addEventListener("ended", () => {
        if (currentBtn) {
          currentBtn.textContent = "▶ 播放";
          currentBtn.classList.remove("playing");
          currentBtn = null;
        }
      });
      list.appendChild(sec);
    });
  </script>
</body>
</html>
